{
  "attention_implementation": "eager",
  "base_dtype": "fp32",
  "dataset_path": "data/sample.jsonl",
  "device": "cpu",
  "gradient_accumulation_steps": 1,
  "gradient_checkpointing": false,
  "learning_rate": 0.0002,
  "local_files_only": false,
  "lora_alpha": 32,
  "lora_dropout": 0.05,
  "lora_rank": 8,
  "lora_target_scope": "attention",
  "loss_backend": "stock",
  "loss_mode": "all",
  "max_steps": 5,
  "method": "lora",
  "micro_batch_size": 1,
  "model_id": "sshleifer/tiny-gpt2",
  "optimizer": "adamw_torch",
  "output_dir": "output",
  "quantization": "none",
  "revision": "main",
  "seq_len": 128,
  "target_modules": [
    "c_attn",
    "c_proj"
  ],
  "training_backend": "transformers",
  "truncation": "error",
  "use_liger_kernel": false
